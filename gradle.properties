#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
# Two suggestions measured here and not taken:
# - the parallel collector, which Android Studio's Build Analyzer recommends: on the same full
#   rebuild it took 60-62 s against the default G1's 64 s, inside the run-to-run spread, and spent
#   twice as long paused (twelve full collections as the heap grew, none under G1);
# - `org.gradle.configuration-cache.parallel` (incubating): a reused entry loaded in 1.1-1.2 s with
#   it and without it. Tasks already run in parallel under the configuration cache.
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.native.ignoreDisabledTargets=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
