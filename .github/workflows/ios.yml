name: iOS

# No `paths` allowlist on purpose: it used to name `core/media/**` only, so the
# core:data / core:playback split would have skipped iOS entirely.
# An ignore list cannot go stale the same way — a new module is covered by default.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and test the iOS targets
    # macos-15 (Xcode 16.4, iOS 18.5 SDK) cannot link a test binary that pulls in
    # compose.ui:ui-uikit: its CMPLayoutRegion references UIViewLayoutRegion, a UIKit
    # class that only exists in the iOS 26 SDK. This never showed up while the workflow
    # only built core:media, which has no Compose dependency.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Kotlin/Native keeps its compiler distribution and per-target klib cache in ~/.konan,
      # outside Gradle User Home entirely — `setup-java`'s `cache: gradle` above never touches it,
      # and it is what Kotlin's own docs name as the thing to preserve between CI builds. A cold
      # run pays for it twice, once per native target this job builds (iosSimulatorArm64Test,
      # then the arm64 framework link): a 2026-08-14 run compiled every module cleanly and still
      # hit the 45-minute job timeout during linking, the one target the simulator test run had
      # not already warmed .konan for.
      #
      # Keyed on the Kotlin version pinned in the version catalog, since that is what actually
      # determines the compiler distribution and the shape of the klib cache; restore-keys falls
      # back to the most recent same-OS cache on a miss so a version bump still starts from
      # something instead of nothing, and the exact key is written fresh at the end of this run.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # Covers every module that has iOS tests, so a new one is picked up without touching this
      # file: core:sound:catalog, core:sound:manifest, core:sound:delivery, core:sound:favorites,
      # core:story:catalog, core:story:manifest, core:playback:session, core:playback:engine, shared.
      - name: Run Simulator ARM64 tests
        run: ./gradlew -PenableIos=true iosSimulatorArm64Test --stacktrace

      # The device target is a separate compilation; linking the framework the iOS app
      # actually consumes is what proves every module builds for real hardware.
      - name: Link the iPhone ARM64 framework
        run: ./gradlew -PenableIos=true :shared:linkDebugFrameworkIosArm64 --stacktrace
