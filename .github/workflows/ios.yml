name: iOS

# No `paths` allowlist on purpose: one used to name a single module's directory, and the first
# time that module was split the iOS job stopped running on the half that moved — silently, since
# a workflow that never triggers reports nothing. An ignore list cannot go stale the same way: a
# module added or renamed tomorrow is covered by default.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and test the iOS targets
    # macos-15 (Xcode 16.4, iOS 18.5 SDK) cannot link a test binary that pulls in
    # compose.ui:ui-uikit: its CMPLayoutRegion references UIViewLayoutRegion, a UIKit
    # class that only exists in the iOS 26 SDK. This stayed hidden while the workflow built
    # only playback code, which has no Compose dependency; the feature screen tests brought it out.
    runs-on: macos-26
    # A cold Kotlin/Native cache after a library update needs more than 45: the Compose 1.12 run
    # spent 24 minutes on its first test link alone. The two long steps carry their own limits
    # below (55 + 30), so this one is only ever the backstop.
    timeout-minutes: 95

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Kotlin/Native keeps its compiler distribution and per-target klib cache in ~/.konan,
      # outside Gradle User Home entirely — `setup-java`'s `cache: gradle` above never touches it,
      # and it is what Kotlin's own docs name as the thing to preserve between CI builds. A cold
      # run pays for it twice, once per native target this job builds (iosSimulatorArm64Test,
      # then the arm64 framework link): a 2026-08-14 run compiled every module cleanly and still
      # hit the 45-minute job timeout during linking, the one target the simulator test run had
      # not already warmed .konan for.
      #
      # Keyed on the Kotlin version pinned in the version catalog, since that is what actually
      # determines the compiler distribution and the shape of the klib cache; restore-keys falls
      # back to the most recent same-OS cache on a miss so a version bump still starts from
      # something instead of nothing, and the exact key is written fresh at the end of this run.
      #
      # Restored here and saved by its own step at the end of the job, whatever became of the
      # steps between. The combined action saves only on success, so a run that timed out threw
      # its work away: the Compose 1.12 update spent 24 minutes caching Compose for the simulator,
      # hit the job limit before the framework link, and the rerun would have started cold again.
      - name: Restore the Kotlin/Native toolchain
        id: konan
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # One task across the whole build, so a new module is picked up without touching this file.
      # It runs every module's `commonTest` on the simulator, plus the `iosTest` source sets that
      # exist only here: the AVFoundation engine in core:playback, and the screen tests in
      # feature:sound and feature:category, whose composables are common code with no second
      # harness on the Android side.
      - name: Run Simulator ARM64 tests
        # Step limits keep the job's own limit out of reach, so the cache save below always runs.
        timeout-minutes: 55
        run: set -o pipefail; ./gradlew -PenableIos=true iosSimulatorArm64Test --stacktrace 2>&1 | tee -a gradle-output.log

      # Kotlin/Native reports a failing simulator test as a bare `kotlin.AssertionError at null:-1`.
      # The message never reaches the Gradle log, whichever assertion was false, so a red run says
      # which *test* failed and nothing more. The detail exists only in what the test task writes
      # to disk, and the job used to throw that away: narrowing one failure took three pushes,
      # splitting assertions across test names until a name identified the line. Keeping the
      # results makes the next one readable on the first run instead. Only on failure — a green
      # run has nothing worth storing.
      - name: Keep the simulator test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-test-results
          path: |
            **/build/test-results/iosSimulatorArm64Test/**
            **/build/reports/tests/iosSimulatorArm64Test/**
          if-no-files-found: ignore
          retention-days: 7

      # The kept results are only reachable by downloading them, which the annotation steps exist
      # to avoid. The same XML names the failing test and carries whatever message the assertion
      # was given, so read it here and say so where the API can reach it.
      - name: Report the failing simulator tests
        if: failure()
        run: |
          : > failing-tests.txt
          while IFS= read -r report; do
            grep -q '<failure\|<error' "$report" || continue
            awk '
              /<testcase /{
                split($0, parts, "name=\"")
                split(parts[2], quoted, "\"")
                name = quoted[1]
              }
              /<failure|<error/{
                if (name != "") {
                  printf "%s -- %s\n", name, substr($0, 1, 300)
                  name = ""
                }
              }
            ' "$report" >> failing-tests.txt
          done < <(find . -path '*iosSimulatorArm64Test*' -name '*.xml')
          if [ -s failing-tests.txt ]; then
            head -10 failing-tests.txt | while IFS= read -r line; do
              echo "::error::${line}"
            done
          else
            echo "::error::No simulator test report recorded a failure; the build broke outside the tests."
          fi

      # The device target is a separate compilation; linking the framework the iOS app
      # actually consumes is what proves every module builds for real hardware.
      - name: Link the iPhone ARM64 framework
        timeout-minutes: 30
        run: set -o pipefail; ./gradlew -PenableIos=true :shared:linkDebugFrameworkIosArm64 --stacktrace 2>&1 | tee -a gradle-output.log

      # The kept results above only exist once a test has run, and they download from the same
      # blob storage a job log does. Annotations come back from the API itself, so a failure that
      # happens while compiling — before any test — is still readable.
      - name: Report what broke
        if: failure()
        run: |
          if [ ! -f gradle-output.log ]; then
            echo "::error::The step failed before Gradle produced any output."
            exit 0
          fi
          detail=$(grep -hE "^e: |^FAILURE: |What went wrong|Task .* FAILED|^Caused by: |violation|Unresolved reference|Could not (resolve|find|determine)" gradle-output.log | head -12 || true)
          if [ -z "$detail" ]; then
            detail=$(tail -12 gradle-output.log || true)
          fi
          printf '%s\n' "$detail" | while IFS= read -r line; do
            echo "::error::${line}"
          done

      # Whatever the steps above did, keep what they compiled into ~/.konan: a failed or timed-out
      # run has usually done the expensive part already. Skipped only when the exact key was
      # restored, since a cache entry cannot be overwritten.
      - name: Save the Kotlin/Native toolchain
        if: always() && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}
