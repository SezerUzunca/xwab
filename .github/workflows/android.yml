name: Android

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check architecture, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Corretto because `gradle/gradle-daemon-jvm.properties` asks for Amazon's 21. With any other
      # vendor here, Gradle has to download Corretto again on every run before it can start the daemon.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # `setup-java`'s own `cache: gradle` kept Gradle's home under a hash of every build script and
      # had nothing to fall back on, so a change to any `build.gradle.kts` — most pull requests here —
      # started from an empty cache: over ten minutes for this job where an unchanged one took about one.
      # This restores the newest cache `main` saved, whatever changed since, and Gradle downloads and
      # compiles only the difference. Its build cache lives in the same directory, so a module the
      # change did not touch comes back from the cache instead of being compiled again.
      #
      # Only `main` writes, at the end of this job. A pull request's cache would be visible to that
      # pull request alone, and each is close to a gigabyte of the repository's ten.
      - name: Restore the Gradle caches
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-android-${{ github.sha }}
          restore-keys: |
            gradle-${{ runner.os }}-android-

      - name: Check architecture, test its rules, and run Android host tests
        run: set -o pipefail; ./gradlew :check testAndroidHostTest --stacktrace 2>&1 | tee -a gradle-output.log

      # Gradle's console reports a failed test as a class, a method and a line number, which is the
      # line of the test function rather than of the expectation that broke. For a test that fails
      # only here — `aFailureAfterAStreamChunkIsStillATransportFailure` has never reproduced on a
      # developer machine — that is not enough to tell which assertion went, and the JUnit XML that
      # says so is discarded with the runner. Printed rather than uploaded so it needs no action
      # version and is readable straight from the job log.
      - name: Report the failing test expectations
        if: failure()
        run: |
          found=0
          while IFS= read -r report; do
            if grep -q '<failure\|<error' "$report"; then
              found=1
              echo "::group::$report"
              cat "$report"
              echo "::endgroup::"
            fi
          done < <(find . -path '*/build/test-results/*' -name '*.xml')
          if [ "$found" -eq 0 ]; then
            echo "No JUnit report recorded a failure; the build failed before or outside the tests."
          fi

      # A job log is only reachable through a redirect to blob storage, and an uploaded artifact
      # and a step summary both come from the same place — a network that filters it leaves a
      # failed run completely opaque. Annotations are part of the check run and come back from the
      # API itself, so what broke stays readable wherever the run can be listed at all. Same
      # motivation as printing the JUnit reports above rather than uploading them; this one catches
      # the failures that happen before any test runs.
      - name: Report what broke
        if: failure()
        run: |
          if [ ! -f gradle-output.log ]; then
            echo "::error::The step failed before Gradle produced any output."
            exit 0
          fi
          detail=$(grep -hE "^e: |^FAILURE: |What went wrong|Task .* FAILED|^Caused by: |violation|Unresolved reference|Could not (resolve|find|determine)" gradle-output.log | head -12 || true)
          if [ -z "$detail" ]; then
            detail=$(tail -12 gradle-output.log || true)
          fi
          printf '%s\n' "$detail" | while IFS= read -r line; do
            echo "::error::${line}"
          done

      # Kotlin static analysis. Every module applies `xwab.detekt`, which registers `staticAnalysis`;
      # naming the task without a project runs it in each of them. Findings that predate detekt are in
      # each module's baseline, so only new ones fail this step.
      - name: Analyse Kotlin with detekt
        id: detekt
        run: set -o pipefail; ./gradlew staticAnalysis --stacktrace 2>&1 | tee -a gradle-output.log

      - name: Report the detekt findings
        if: failure() && steps.detekt.outcome == 'failure'
        run: |
          found=0
          while IFS= read -r report; do
            while IFS= read -r finding; do
              found=1
              echo "::error::${report%%/build/*}: ${finding}"
            done < <(grep -oE '<error [^>]*>' "$report" | sed -E 's/.*line="([0-9]+)".*message="([^"]*)".*source="([^"]*)".*/line \1: \2 [\3]/' | head -20)
          done < <(find . -path '*/build/reports/detekt/*.xml' -not -path './build-logic/*')
          if [ "$found" -eq 0 ]; then
            echo "::error::detekt reported no findings; it failed before or outside the analysis."
          fi

      # Android Lint had never run against this project. `checkArchitecture` guards the shape of the
      # build and the tests guard behaviour, but nothing was reading the manifest, the resources or
      # the merged APK for the class of mistake lint is for — and two of those, a light launch theme
      # and a status bar that followed the device instead of the app, reached a device before anyone
      # noticed. Reports rather than uploads its findings, for the reason the steps below give.
      - name: Lint the Android application
        id: lint
        run: set -o pipefail; ./gradlew :androidApp:lintDebug --stacktrace 2>&1 | tee -a gradle-output.log

      - name: Report the lint findings
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          report=androidApp/build/reports/lint-results-debug.xml
          if [ ! -f "$report" ]; then
            echo "::error::Lint produced no report; it failed before analysing."
            exit 0
          fi
          grep -oE 'id="[^"]*"|message="[^"]*"|file="[^"]*"' "$report" \
            | paste - - - 2>/dev/null \
            | head -20 \
            | while IFS= read -r finding; do
                echo "::error::${finding}"
              done

      - name: Assemble debug APK
        run: set -o pipefail; ./gradlew :androidApp:assembleDebug --stacktrace 2>&1 | tee -a gradle-output.log

      # The release variant was never built here, so nothing that only breaks in it — a packaging
      # rule, a resource the debug manifest happens to supply, the shrinker once it is switched on —
      # could be caught before someone tried to cut a release. It produces an unsigned APK today;
      # signing needs a keystore this repository does not hold.
      - name: Assemble release APK
        run: set -o pipefail; ./gradlew :androidApp:assembleRelease --stacktrace 2>&1 | tee -a gradle-output.log

      # Stopped first, so nothing is still writing into the caches while they are archived. Stopping
      # is also when Gradle deletes what has gone unused — build outputs after a week, downloads after
      # a month — which keeps each saved cache from growing on the last. Keyed on the commit, so
      # every push to `main` saves one and the newest is what the restore above finds.
      - name: Stop Gradle before saving its caches
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        run: ./gradlew --stop

      - name: Save the Gradle caches
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  device-test:
    name: Run playback service device tests
    runs-on: ubuntu-latest
    # Two emulator attempts have to fit, and one costs roughly thirteen minutes.
    timeout-minutes: 45

    env:
      # Stated once because two steps run it. The runner hands this to `sh`, so it has to stay
      # POSIX: no pipefail, and the exit status has to be carried across the redirect by hand
      # rather than through a pipe.
      DEVICE_TEST_SCRIPT: ./gradlew :core:playback:connectedAndroidTest --stacktrace > gradle-output.log 2>&1; status=$?; cat gradle-output.log; exit $status

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Corretto because `gradle/gradle-daemon-jvm.properties` asks for Amazon's 21. With any other
      # vendor here, Gradle has to download Corretto again on every run before it can start the daemon.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Reads what the build job saved on `main` and never writes: this job compiles a subset of
      # what that one does, so its cache would only be a smaller copy of the same thing.
      - name: Restore the Gradle caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-android-${{ github.sha }}
          restore-keys: |
            gradle-${{ runner.os }}-android-

      # This job failed in roughly one run in three without anything in the repository being
      # involved: the same signature appeared on a commit that passed unchanged on the next one,
      # and on a pull request whose diff touched no file this job compiles.
      #
      # The log says what it is, and it is not a slow boot — the emulator reports boot completed
      # and answers adb. Seconds later the guest's system_server goes down and comes back, and the
      # action's own `settings put animator_duration_scale` lands in that window:
      #
      #     cmd: Failure calling service settings: Broken pipe (32)
      #     The process '.../adb' failed with exit code 224
      #
      # The action aborts there, so Gradle never starts and there is nothing to report. Raising
      # `emulator-boot-timeout` would not touch this; a second emulator does. A real test failure
      # fails both attempts and still fails the job.
      - name: Run Android device tests on an emulator
        id: device-tests
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ${{ env.DEVICE_TEST_SCRIPT }}

      - name: Retry the device tests on a fresh emulator
        if: steps.device-tests.outcome == 'failure'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ${{ env.DEVICE_TEST_SCRIPT }}

      # Both attempts write the same log, so this reads whichever one the job actually failed on.
      # It cannot run after a first attempt that was retried: `continue-on-error` keeps that
      # failure off the job, so `failure()` is true only once the retry has failed too.
      - name: Report what broke
        if: failure()
        run: |
          if [ ! -f gradle-output.log ]; then
            echo "::error::The step failed before Gradle produced any output."
            exit 0
          fi
          detail=$(grep -hE "^e: |^FAILURE: |What went wrong|Task .* FAILED|^Caused by: |violation|Unresolved reference|Could not (resolve|find|determine)" gradle-output.log | head -12 || true)
          if [ -z "$detail" ]; then
            detail=$(tail -12 gradle-output.log || true)
          fi
          printf '%s\n' "$detail" | while IFS= read -r line; do
            echo "::error::${line}"
          done

      # Gradle names the HTML report and nothing else, and that report is a file on a runner nobody
      # can attach to. The instrumentation XML beside it names the test and carries the message its
      # assertion was given, so read it here.
      - name: Report the failing device tests
        if: failure()
        run: |
          : > failing-tests.txt
          while IFS= read -r report; do
            grep -q '<failure\|<error' "$report" || continue
            awk '
              /<testcase /{
                split($0, parts, "name=\"")
                split(parts[2], quoted, "\"")
                name = quoted[1]
              }
              /<failure|<error/{
                if (name != "") {
                  printf "%s -- %s\n", name, substr($0, 1, 300)
                  name = ""
                }
              }
            ' "$report" >> failing-tests.txt
          done < <(find . -path '*androidTest-results*' -name '*.xml')
          if [ -s failing-tests.txt ]; then
            head -10 failing-tests.txt | while IFS= read -r line; do
              echo "::error::${line}"
            done
          else
            echo "::error::No instrumentation report recorded a failure; the build broke outside the tests."
          fi
