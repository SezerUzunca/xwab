name: Android

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check architecture, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check architecture, test its rules, and run Android host tests
        run: set -o pipefail; ./gradlew :check testAndroidHostTest --stacktrace 2>&1 | tee -a gradle-output.log

      # Gradle's console reports a failed test as a class, a method and a line number, which is the
      # line of the test function rather than of the expectation that broke. For a test that fails
      # only here — `aFailureAfterAStreamChunkIsStillATransportFailure` has never reproduced on a
      # developer machine — that is not enough to tell which assertion went, and the JUnit XML that
      # says so is discarded with the runner. Printed rather than uploaded so it needs no action
      # version and is readable straight from the job log.
      - name: Report the failing test expectations
        if: failure()
        run: |
          found=0
          while IFS= read -r report; do
            if grep -q '<failure\|<error' "$report"; then
              found=1
              echo "::group::$report"
              cat "$report"
              echo "::endgroup::"
            fi
          done < <(find . -path '*/build/test-results/*' -name '*.xml')
          if [ "$found" -eq 0 ]; then
            echo "No JUnit report recorded a failure; the build failed before or outside the tests."
          fi

      # A job log is only reachable through a redirect to blob storage, and an uploaded artifact
      # and a step summary both come from the same place — a network that filters it leaves a
      # failed run completely opaque. Annotations are part of the check run and come back from the
      # API itself, so what broke stays readable wherever the run can be listed at all. Same
      # motivation as printing the JUnit reports above rather than uploading them; this one catches
      # the failures that happen before any test runs.
      - name: Report what broke
        if: failure()
        run: |
          if [ ! -f gradle-output.log ]; then
            echo "::error::The step failed before Gradle produced any output."
            exit 0
          fi
          detail=$(grep -hE "^e: |^FAILURE: |What went wrong|Task .* FAILED|^Caused by: |violation|Unresolved reference|Could not (resolve|find|determine)" gradle-output.log | head -12 || true)
          if [ -z "$detail" ]; then
            detail=$(tail -12 gradle-output.log || true)
          fi
          printf '%s\n' "$detail" | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Assemble debug APK
        run: set -o pipefail; ./gradlew :androidApp:assembleDebug --stacktrace 2>&1 | tee -a gradle-output.log

  device-test:
    name: Run playback service device tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android device tests on an emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          # The runner hands this to `sh`, so it has to stay POSIX: no pipefail, and the exit
          # status has to be carried across the redirect by hand rather than through a pipe.
          script: ./gradlew :core:playback:connectedAndroidTest --stacktrace > gradle-output.log 2>&1; status=$?; cat gradle-output.log; exit $status

      - name: Report what broke
        if: failure()
        run: |
          if [ ! -f gradle-output.log ]; then
            echo "::error::The step failed before Gradle produced any output."
            exit 0
          fi
          detail=$(grep -hE "^e: |^FAILURE: |What went wrong|Task .* FAILED|^Caused by: |violation|Unresolved reference|Could not (resolve|find|determine)" gradle-output.log | head -12 || true)
          if [ -z "$detail" ]; then
            detail=$(tail -12 gradle-output.log || true)
          fi
          printf '%s\n' "$detail" | while IFS= read -r line; do
            echo "::error::${line}"
          done
